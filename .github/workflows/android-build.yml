name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build release APK (arm64-v8a only)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK (signature, architecture, metadata)
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          echo "=== Size ==="
          ls -l "$APK"
          echo "=== SHA-256 ==="
          sha256sum "$APK"
          echo "=== apksigner verify ==="
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose "$APK"
          echo "=== aapt2 badging ==="
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)"
          "$AAPT2" dump badging "$APK" | head -n 12
          echo "=== Native libraries (must be arm64-v8a only) ==="
          if unzip -l "$APK" | grep "lib/"; then
            if unzip -l "$APK" | grep -Eq "lib/(armeabi|x86|mips)"; then
              echo "::error::APK contains non-arm64 native libraries"
              exit 1
            fi
          else
            echo "No native lib directories (pure WebView app) - OK"
          fi
          echo "VERIFICATION PASSED"

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          VERSION="$(node -p "require('./package.json').version")"
          ASSET="study-planner-${VERSION}-arm64.apk"
          cp "$APK" "$ASSET"
          sha256sum "$ASSET" > "${ASSET}.sha256"
          SIZE="$(stat -c%s "$ASSET")"
          SHA="$(awk '{print $1}' "${ASSET}.sha256")"
          {
            echo "## منظّم دراستي v${VERSION}"
            echo ""
            echo "- المعمارية: arm64-v8a فقط"
            echo "- الحجم: ${SIZE} بايت"
            echo "- SHA-256: \`${SHA}\`"
            echo "- موقّع بمفتاح release (study-release.jks) ومتحقق منه بـ apksigner"
          } > release-notes.md
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" "$ASSET" "${ASSET}.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v${VERSION}" "$ASSET" "${ASSET}.sha256" --title "منظّم دراستي v${VERSION}" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          fi
